apiVersion: v1
kind: ServiceAccount
metadata:
  name: chonkcraft-matchmaker-deployer
  namespace: chonk-mp
  labels:
    app.kubernetes.io/name: chonkcraft-matchmaker-deployer
    app.kubernetes.io/part-of: chonkcraft
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chonkcraft-matchmaker-deployer
  namespace: chonk-mp
  labels:
    app.kubernetes.io/name: chonkcraft-matchmaker-deployer
    app.kubernetes.io/part-of: chonkcraft
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["chonkcraft-matchmaker"]
    verbs: ["get", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["chonkcraft-matchmaker"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    resourceNames: ["chonkcraft-matchmaker"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    resourceNames: ["chonkcraft-matchmaker"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chonkcraft-matchmaker-deployer
  namespace: chonk-mp
  labels:
    app.kubernetes.io/name: chonkcraft-matchmaker-deployer
    app.kubernetes.io/part-of: chonkcraft
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chonkcraft-matchmaker-deployer
subjects:
  - kind: ServiceAccount
    name: chonkcraft-matchmaker-deployer
    namespace: chonk-mp
