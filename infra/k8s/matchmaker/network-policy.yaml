apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chonkcraft-matchmaker
  namespace: chonk-mp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chonkcraft-matchmaker
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 9092
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
