apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chonkcraft-matchmaker
  namespace: chonk-mp
  labels:
    app.kubernetes.io/name: chonkcraft-matchmaker
    app.kubernetes.io/part-of: chonkcraft
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "16k"
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [match.chonkbase.net]
      secretName: chonkcraft-matchmaker-tls
  rules:
    - host: match.chonkbase.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chonkcraft-matchmaker
                port:
                  name: http
