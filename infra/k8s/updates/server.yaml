apiVersion: v1
kind: ConfigMap
metadata:
  name: chonkcraft-updates-nginx
  namespace: chonkcraft-updates
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      autoindex off;

      location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location = /latest.properties {
        default_type text/plain;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location /releases/release-notes/ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location /releases/ {
        default_type application/java-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location = /downloads/latest-macos.properties {
        default_type text/plain;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location = /downloads/latest.json {
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location /downloads/latest/ {
        default_type application/octet-stream;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location /downloads/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chonkcraft-updates
  namespace: chonkcraft-updates
  labels:
    app.kubernetes.io/name: chonkcraft-updates
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chonkcraft-updates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chonkcraft-updates
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: chonkcraft-updates
        - name: config
          configMap:
            name: chonkcraft-updates-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: chonkcraft-updates
  namespace: chonkcraft-updates
spec:
  selector:
    app.kubernetes.io/name: chonkcraft-updates
  ports:
    - name: http
      port: 80
      targetPort: http
