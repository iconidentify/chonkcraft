name: Publish Game Update

# Deployment is master-only; pull-request code never receives production secrets.

on:
  push:
    branches: [master]
    paths:
      - assetpack/**
      - data/**
      - desktop/**
      - engine/**
      - launcher/**
      - runtime/**
      - pom.xml
      - '*/pom.xml'
      - scripts/release/build-update-assets.sh
      - scripts/release/publish-update-kubernetes.sh
      - .github/workflows/publish-game-update.yml
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version; defaults to UTC CalVer plus run number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: chonkcraft-game-update
  cancel-in-progress: false

jobs:
  publish:
    name: Authenticate and publish replaceable game JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://updates.chonkbase.net/latest.properties
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose monotonic game version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED:-$(date -u +%Y.%m%d).${GITHUB_RUN_NUMBER}}"
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,79}$ ]]; then
            echo "Invalid game version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the pinned JetBrains Runtime
        uses: actions/cache@v4
        with:
          path: ~/.chonk/jdks
          key: jbr-25.0.2-b329.117-${{ runner.os }}-${{ runner.arch }}

      - name: Install and verify the pinned build runtime
        run: |
          scripts/jbr/install-jbr-25.sh
          scripts/jbr/with-jbr-25.sh scripts/jbr/assert-jbr-25.sh

      - name: Build authenticated update assets
        env:
          CHONKCRAFT_VERSION: ${{ steps.version.outputs.value }}
          CHONKCRAFT_RELEASE_HISTORY_CATALOG: https://updates.chonkbase.net/latest.properties
          CHONKCRAFT_OTA_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.CHONKCRAFT_OTA_ED25519_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s RELEASE_NOTES.md ]]; then
            title="$(sed -n '1s/^# //p' RELEASE_NOTES.md)"
            notes="$(tail -n +3 RELEASE_NOTES.md)"
            test -n "$title"
            test -n "$notes"
          else
            title="$(git log -1 --pretty=%s)"
            before='${{ github.event.before }}'
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]] \
                && git cat-file -e "$before^{commit}" 2>/dev/null; then
              notes="$(git log --reverse --pretty='- %s' "$before..${GITHUB_SHA}")"
            else
              notes="- $title"
            fi
          fi
          export CHONKCRAFT_RELEASE_TITLE="$title"
          export CHONKCRAFT_RELEASE_NOTES="$notes"
          scripts/release/build-update-assets.sh

      - name: Prove the production launcher accepts and installs the publication
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          catalog="$(pwd)/desktop/target/dist/update/latest.properties"
          scripts/jbr/with-jbr-25.sh java \
            -Dchonkcraft.update.catalog="file://${catalog}" \
            -jar launcher/target/chonkcraft-launcher-0.1.0-SNAPSHOT-app.jar \
            --home "$test_home" --update
          installed="$test_home/versions/${{ steps.version.outputs.value }}/game.jar"
          published="$(find desktop/target/dist/update/releases -name 'chonkcraft-game-*.jar')"
          history="$(find desktop/target/dist/update/releases/release-notes \
            -name 'chonkcraft-release-notes-*.properties')"
          test -s "$installed"
          cmp "$published" "$installed"
          test -s "$history"
          test -s "$test_home/release-notes.properties"
          cmp "$history" "$test_home/release-notes.properties"

      - name: Load least-privilege publisher credentials
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.CHONKCRAFT_UPDATES_KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Verify publisher is narrowly scoped
        shell: bash
        run: |
          set -euo pipefail
          kubectl auth can-i get pods -n chonkcraft-updates | grep -qx yes
          kubectl auth can-i create pods --subresource=exec \
            -n chonkcraft-updates | grep -qx yes
          if kubectl auth can-i get secrets -n chonkcraft-updates | grep -qx yes; then
            echo "Publisher unexpectedly has Secret read access." >&2
            exit 1
          fi
          if kubectl auth can-i update deployments.apps -n chonkcraft-updates | grep -qx yes; then
            echo "Publisher unexpectedly has workload mutation access." >&2
            exit 1
          fi

      - name: Publish JAR first and authenticated catalog last
        run: scripts/release/publish-update-kubernetes.sh

      - name: Prove the public endpoint through a fresh launcher home
        shell: bash
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          scripts/jbr/with-jbr-25.sh java \
            -jar launcher/target/chonkcraft-launcher-0.1.0-SNAPSHOT-app.jar \
            --home "$test_home" --update
          test -s "$test_home/versions/${{ steps.version.outputs.value }}/game.jar"
          test -s "$test_home/release-notes.properties"

      - name: Retain publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: chonkcraft-game-update-${{ steps.version.outputs.value }}
          path: |
            desktop/target/dist/update/latest.properties
            desktop/target/dist/update/releases/release-notes/*.properties
          retention-days: 90
